# ===========================================
# Site Information Settings
# ===========================================

# Site creation time
since: 2014

# Custom your favicon.ico in `site/source`
favicon: /favicon.ico

# Set feed link (false | default | your feed link)
# false: disable
# default: use `atom.xml`, generator for `hexo-generator-feed`
rss: default

# ===========================================
# Menu Settings
# ===========================================
menu:
  Archives: /archives
  About: /about
  Resume: /resume

# ===========================================
# Widget Settings
# ===========================================
# widget function
# false: disable
# widget_custom: custom your widget
#   title: your widget title
#   content: Add your html code in here. Example: <p>testing...</p>
widget:
  Tags: true
  Categories: true
  Custom: false
  TagCategoryCloud: true

widget_custom:
    title: Test
    content: <p>testing...</p>

# ===========================================
# Theme Settings
# ===========================================
# theme styling
# color: Default | Mint Green | Cobalt Blue | Hot Pink | Dark Violet
theme:
  color: Default
  fancybox: false

# ===========================================
# Third Party Services Settings
# ===========================================

# Baidu Analytics
baidu_analytics:
# Google Analytics
google_analytics: G-MJEDN7D89G
# Microsoft Clarity (public pages only)
clarity_project_id: ydyci83xyu

# Self-hosted Umami: public website ID and tracking script from our Vercel instance.
# No API key belongs in the theme or generated HTML.
umami:
  enable: true
  website_id: 7ae63952-76fc-4a90-a5b7-aedd93fb56c9
  script_url: https://wxxlamp-umami.vercel.app/script.js
  domains: wxxlamp.cn
  counters_url: https://wxxlamp-umami.vercel.app/api/public/blog-stats
  cloud:
    enable: true
    website_id: 27d58970-f2c7-47fb-a0ea-380f8123c229
    script_url: https://cloud.umami.is/script.js

# Busuanzi collection stays enabled independently; visible counters use self-hosted Umami.
busuanzi:
  enable: true

# Verified against giscus on 2026-09-07 after enabling Discussions.
giscus:
  enable: true
  repo: wxxlamp/wxxlamp.github.io
  repo_id: MDEwOlJlcG9zaXRvcnkzMTM0ODIyMzc=
  category: Announcements
  category_id: DIC_kwDOEq9b_c4DFFLD

# Duoshuo
